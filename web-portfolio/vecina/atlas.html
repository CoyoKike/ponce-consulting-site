<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<meta name="robots" content="noindex, nofollow">
<title>District map · Vecina</title>
<meta name="description" content="Every Boston City Council, State Senate and State House district on one map, shaded by public data on age, poverty, language and health.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/dmsans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css?v=20261116h">
<link rel="stylesheet" href="css/districts.css?v=20261116h">
</head>
<body class="atlas">
<a class="skip" href="#officials">Skip to the list of officials</a>
<main id="main">
<h1 class="sr-only">Boston district map</h1>

<div id="amap" class="atlas__map"></div>

<section class="apanel" aria-labelledby="apTitle">
  <div class="apanel__head">
    <a class="brand" href="./" aria-label="Vecina, home">
      <svg class="brand__mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false"><circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M20 9c-5 0-9 4-9 9 0 7 9 13 9 13s9-6 9-13c0-5-4-9-9-9Zm0 12.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" fill="currentColor"/></svg>
      <span class="brand__name">Vecina</span>
    </a>
    <a class="apanel__link" href="districts.html">All briefings</a>
  </div>
  <h2 id="apTitle" class="apanel__title">Boston, <em>district by district</em></h2>
  <div class="apanel__levels" role="group" aria-label="Level of government">
    <button type="button" class="pill" data-ch="City Council" aria-pressed="true">City Council</button>
    <button type="button" class="pill" data-ch="State Senate" aria-pressed="false">State Senate</button>
    <button type="button" class="pill" data-ch="State House" aria-pressed="false">State House</button>
  </div>
  <label class="apanel__searchlbl" for="aq">Find an official or district</label>
  <input id="aq" class="apanel__search" type="search" autocomplete="off" placeholder="Name or district">
  <p class="sr-only" id="aCount" role="status" aria-live="polite"></p>
  <ul class="apanel__list" id="officials" tabindex="-1"></ul>
</section>

<div class="atools">
  <div class="atools__m" role="group" aria-label="Shade the map by" id="aMeasures"></div>
  <button type="button" class="atools__3d" id="a3d" aria-pressed="false">3D</button>
</div>

<div class="alegend" id="aLegend" aria-hidden="true"></div>

<section class="acard" id="aCard" aria-labelledby="acName" hidden>
  <header class="acard__head">
    <img class="acard__photo" id="acPhoto" alt="" width="88" height="88">
    <div>
      <p class="acard__lvl" id="acLvl"></p>
      <h2 class="acard__name" id="acName"></h2>
      <p class="acard__dist" id="acDist"></p>
    </div>
    <button type="button" class="iconbtn acard__x" id="acClose" aria-label="Close"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
  </header>
  <div class="acar" id="acCar" aria-roledescription="carousel" aria-label="District data">
    <div class="acar__track" id="acSlides"></div>
    <div class="acar__nav">
      <button type="button" class="iconbtn" id="acPrev" aria-label="Previous slide"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="acar__dots" id="acDots"></div>
      <button type="button" class="iconbtn" id="acNext" aria-label="Next slide"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <p class="sr-only" id="acLive" aria-live="polite"></p>
  </div>
  <a class="btn btn--solid acard__open" id="acOpen" href="#">Open the full briefing <span aria-hidden="true">→</span></a>
</section>

</main>

<footer><p class="acredit">Sources: U.S. Census Bureau ACS · CDC PLACES · City of Boston · MA Legislature · map © OpenFreeMap, OpenMapTiles, OpenStreetMap contributors</p></footer>

<script src="assets/maplibre/maplibre-gl.js"></script>
<script src="js/charts.js?v=20261116h"></script>
<script src="js/atlas.js?v=20261116h"></script>
</body>
</html>
